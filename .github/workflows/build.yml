name: Build & Push compositor image

# Builds the compositor image and pushes it to GHCR, after publishing the
# libnvnmos image it links where the pinned one is not published yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/qvest-digital/dmf-mf-mxl-compositor

jobs:
  # libnvnmos, built from docker/nvnmos/Dockerfile into its own image tagged by
  # the NvNmos commit the compositor's Dockerfile pins. Its dependencies are
  # compiled from source and take the better part of an hour, so it is built
  # only when that tag is not already published -- once per NvNmos bump. A
  # pull request that bumps it builds the image without pushing and hands it
  # to the compositor build below.
  nvnmos:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
      built: ${{ steps.check.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the pinned NvNmos commit
        id: ref
        shell: bash
        run: |
          ref=$(sed -n 's/^ARG NVNMOS_REF=//p' Dockerfile)
          [[ -n "$ref" ]] || { echo "no ARG NVNMOS_REF in Dockerfile" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE }}/nvnmos:$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is it published already
        id: check
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up buildx
        if: steps.check.outputs.missing == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build libnvnmos
        if: steps.check.outputs.missing == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/nvnmos
          file: docker/nvnmos/Dockerfile
          build-args: NVNMOS_REF=${{ steps.ref.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.image }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,dest=/tmp/nvnmos.tar' || '' }}

      - name: Hand the unpublished image on
        if: steps.check.outputs.missing == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nvnmos
          path: /tmp/nvnmos.tar
          retention-days: 1

  build-and-push:
    needs: nvnmos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the unpublished libnvnmos image
        if: needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: nvnmos
          path: /tmp

      - name: Load it
        if: needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request'
        run: docker load -i /tmp/nvnmos.tar

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The docker driver sees images loaded into the local daemon, which
          # is how a pull request that bumps NvNmos builds against it.
          driver: ${{ needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request' && 'docker' || 'docker-container' }}

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('{0}:{1}', env.IMAGE, steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: ${{ !(needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request') && 'type=gha' || '' }}
          cache-to: ${{ !(needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request') && 'type=gha,mode=max' || '' }}
