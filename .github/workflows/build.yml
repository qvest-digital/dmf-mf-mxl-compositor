name: Build & Push compositor image

# Builds the compositor image and pushes it to GHCR, after publishing the
# libnvnmos image it links where the pinned one is not published yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/qvest-digital/dmf-mf-mxl-compositor

jobs:
  # libnvnmos, built from docker/nvnmos/Dockerfile into its own image tagged by
  # the NvNmos commit the compositor's Dockerfile pins and a hash over
  # docker/nvnmos/. Its dependencies are
  # compiled from source and take the better part of an hour, so it is built
  # only when that tag is not already published -- once per NvNmos bump. A
  # pull request that bumps it builds the image without pushing and hands it
  # to the compositor build below.
  nvnmos:
    runs-on: ubuntu-latest
    # One libnvnmos build at a time. Two runs that both find the tag missing
    # would otherwise each spend the better part of an hour and push it twice.
    concurrency:
      group: nvnmos
      cancel-in-progress: false
    outputs:
      image: ${{ steps.ref.outputs.image }}
      built: ${{ steps.check.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the pinned NvNmos commit
        id: ref
        shell: bash
        run: |
          ref=$(sed -n 's/^ARG NVNMOS_REF=//p' Dockerfile)
          [[ -n "$ref" ]] || { echo "no ARG NVNMOS_REF in Dockerfile" >&2; exit 1; }
          # The tag names everything the image is built from, so a changed
          # patch, Dockerfile or script is a new image. A Dockerfile naming
          # another hash would build against a stale one.
          build=$(sed -n 's/^ARG NVNMOS_BUILD=//p' Dockerfile)
          want=$(find docker/nvnmos -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-8)
          [[ "$build" == "$want" ]] || {
            echo "ARG NVNMOS_BUILD=$build in Dockerfile, but docker/nvnmos/ hashes to $want" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE }}/nvnmos:$ref-$build" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is it published already
        id: check
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up buildx
        if: steps.check.outputs.missing == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build libnvnmos
        if: steps.check.outputs.missing == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/nvnmos
          file: docker/nvnmos/Dockerfile
          build-args: NVNMOS_REF=${{ steps.ref.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.image }}
          # Keeps the Conan dependency layer (nmos-cpp, Boost, OpenSSL) between
          # runs, so rebuilding for a new NVNMOS_REF does not start from zero.
          cache-from: type=gha,scope=nvnmos
          cache-to: type=gha,scope=nvnmos,mode=max
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,dest=/tmp/nvnmos.tar' || '' }}

      - name: Hand the unpublished image on
        if: steps.check.outputs.missing == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nvnmos
          path: /tmp/nvnmos.tar
          retention-days: 1

  build-and-push:
    needs: nvnmos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the unpublished libnvnmos image
        if: needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: nvnmos
          path: /tmp

      - name: Load it
        if: needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request'
        run: docker load -i /tmp/nvnmos.tar

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The docker driver sees images loaded into the local daemon, which
          # is how a pull request that bumps NvNmos builds against it.
          driver: ${{ needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request' && 'docker' || 'docker-container' }}

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Loaded as well, so the SBOM below describes the image this build
          # produced, on pull requests too.
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('{0}:{1}', env.IMAGE, steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: ${{ !(needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request') && 'type=gha' || '' }}
          cache-to: ${{ !(needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request') && 'type=gha,mode=max' || '' }}
          # The docker driver stores no attestations.
          provenance: ${{ !(needs.nvnmos.outputs.built == 'true' && github.event_name == 'pull_request') && 'mode=max' || 'false' }}

      # Pinned by commit: a tag of a third-party action can be moved.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      # The image is catalogued once. The vulnerability report, the SPDX copy
      # and the gate below are all derived from this one CycloneDX SBOM, so
      # what a finding was matched against is the file that is kept.
      #
      # What go-mxl and this repository build from source (libmxl, libfabric,
      # rdma-core, the vcpkg ports, libmxl-monitoring, NvNmos and the conan
      # packages linked into it) is recorded by no package manager, so Trivy
      # cannot see it. The image carries it as CycloneDX fragments under
      # /opt/*/share/sbom/, and their components are appended here. The four
      # fragments are required by name, so losing one fails the step; the
      # glob still picks up any added later. Trivy itself reads the conan
      # components of a fragment it finds in the image, and go-mxl and this
      # image both record picojson, so components are kept once per bom-ref:
      # a CycloneDX document with a repeated bom-ref is invalid.
      #
      # Trivy matches advisories by package type. Components identified by
      # pkg:github or by no purl at all (NvNmos, libmxl, libfabric,
      # rdma-core, libmxl-monitoring, the vcpkg ports) are listed in the
      # SBOM but matched against nothing, so neither report.json nor the
      # gate covers them.
      - name: Generate SBOM and vulnerability report
        env:
          REF: ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
        run: |
          set -o pipefail
          trivy image --quiet --format cyclonedx --output sbom.trivy.json "$REF"
          { cat sbom.trivy.json
            docker run --rm --entrypoint sh "$REF" -c '
              test -f /opt/libfabric/share/sbom/libfabric-stack.cdx.json &&
              test -f /opt/libmxl/share/sbom/libmxl.cdx.json &&
              test -f /opt/nvnmos/share/sbom/nvnmos.cdx.json &&
              test -f /opt/mxl-compositor/share/sbom/mxl-compositor.cdx.json &&
              cat /opt/*/share/sbom/*.cdx.json'
          } | jq -s '.[0].components = ([.[].components[]] | unique_by(.["bom-ref"])) | .[0]' > sbom.cdx.json
          trivy sbom --quiet --format spdx-json --output sbom.spdx.json sbom.cdx.json
          trivy sbom --quiet --format json --output report.json sbom.cdx.json
          # What the gate below sees, and what .trivyignore.yaml accepts.
          # report.json keeps every finding regardless.
          {
            echo '### Trivy: fixable HIGH and CRITICAL'
            echo '```'
            trivy sbom --quiet --format table --severity HIGH,CRITICAL \
              --ignore-unfixed --ignorefile .trivyignore.yaml --show-suppressed \
              sbom.cdx.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM and report
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.tags.outputs.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
            report.json

      - name: Set up ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      # Stored beside the image in GHCR as an OCI referrer, so the SBOM of a
      # published tag outlives the workflow artifact's retention.
      - name: Attach SBOM to the image
        if: github.event_name != 'pull_request'
        env:
          SUBJECT: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "$SUBJECT" sbom.cdx.json:application/vnd.cyclonedx+json

      # Last, so a finding fails the job without holding back the push: the
      # fix for a base image CVE usually lies in a rebuild of go-mxl-runtime,
      # not here. A finding accepted in .trivyignore.yaml does not fail it.
      - name: Fail on fixable HIGH and CRITICAL
        run: |
          trivy sbom --quiet --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 sbom.cdx.json
