# NMOS conformance lane: an nmos-cpp registry, the compositor as an NMOS Node,
# and the AMWA NMOS Testing Tool, on one fixed-address network so the Node can
# be told the address it is reached at. run.sh drives it.
#
# The MXL runtime root is a directory on the host's /dev/shm, which is tmpfs
# as libmxl requires, holding two domains with only the domain_def.json the
# platform would write.
# run.sh creates it; a docker tmpfs volume would not do, because every
# container mounting one gets a tmpfs of its own. writer writes one v210 flow
# into the primary domain with mxl-gst-testsrc, built by writer.Dockerfile on
# the go-mxl images the compositor is built on, so a connected tile has
# something to read and count.
# The suites test what the Node publishes and how it answers IS-05, and a tile
# connected to a flow that is not there stays black without failing.
#
# The compositor keeps its connections in a ConfigMap. apiserver serves that
# one ConfigMap as the Kubernetes API would, and run.sh gives the compositor the
# service account files a pod has, so a restart of the compositor alone shows
# what a replaced pod restores. apiserver also carries ncp.py, which reads a
# tile's BCP-008-01 monitor over IS-12 as a controller would.

name: compositor-nmos

networks:
  lane:
    ipam:
      config:
        - subnet: 172.30.99.0/24

services:
  registry:
    image: rhastie/nmos-cpp:master-079620d
    networks:
      lane:
        ipv4_address: 172.30.99.10
    configs:
      - source: registry-container-config
        target: /home/container-config
      - source: registry-json
        target: /config/registry.json

  rtsp:
    image: bluenviron/mediamtx:1.15.1
    networks:
      lane:
        ipv4_address: 172.30.99.11

  apiserver:
    image: amwa/nmos-testing:master-9001851
    networks:
      lane:
        ipv4_address: 172.30.99.40
    volumes:
      - ./fake-apiserver.py:/fake-apiserver.py:ro
      - ./ncp.py:/ncp.py:ro
      - ${LANE_SECRETS:?run.sh creates the service account files}:/secrets:ro
    entrypoint:
      - python3
      - /fake-apiserver.py
      - /secrets/ca.crt
      - /secrets/tls.key
      - lane-token
      - /api/v1/namespaces/lane/configmaps/compositor-connections

  compositor:
    image: ${COMPOSITOR_IMAGE:-compositor-nmos:dev}
    depends_on:
      registry:
        condition: service_started
      rtsp:
        condition: service_started
      apiserver:
        condition: service_started
    # The search list and DNS name cluster DNS gives a pod in namespace lane,
    # under a cluster domain other than the usual one.
    dns_search: [lane.svc.cluster.lane, svc.cluster.lane, cluster.lane]
    networks:
      lane:
        ipv4_address: 172.30.99.20
        aliases: [172-30-99-20.lane.pod.cluster.lane]
    volumes:
      - ${MXL_ROOT:?run.sh creates the runtime root}:/run/mxl
      - ${LANE_SECRETS}:/var/run/secrets/kubernetes.io/serviceaccount:ro
    environment:
      MXL_DOMAIN: /run/mxl/domain
      MXL_TILES: "4"
      MXL_COMPOSITE_OUT: rtsp://172.30.99.11:8554/composite
      MXL_FRAME_WIDTH: "1280"
      MXL_FRAME_HEIGHT: "720"
      NMOS_HOST_ADDRESS: 172.30.99.20
      NMOS_POD_NAMESPACE: lane
      NMOS_HTTP_PORT: "8080"
      NMOS_CONTROL_PORT: "8218"
      NMOS_SEED: compositor-nmos-lane
      NMOS_REGISTRY_HOST: 172.30.99.10
      NMOS_REGISTRY_PORT: "8010"
      NMOS_CONNECTIONS_CONFIGMAP: compositor-connections
      KUBERNETES_SERVICE_HOST: 172.30.99.40
      KUBERNETES_SERVICE_PORT: "6443"

  writer:
    image: compositor-lane-writer:${GO_MXL_TAG:?run.sh reads it from the Dockerfile}
    build:
      context: .
      dockerfile: writer.Dockerfile
      args:
        GO_MXL_TAG: ${GO_MXL_TAG}
    network_mode: none
    volumes:
      - ${MXL_ROOT}:/run/mxl
    configs:
      - source: writer-flow
        target: /flow.json
    command: [-d, /run/mxl/domain, -v, /flow.json]

  testing:
    image: amwa/nmos-testing:master-9001851
    profiles: [suite]
    networks:
      lane:
        ipv4_address: 172.30.99.30
    configs:
      - source: testing-config
        target: /config/UserConfig.py
    # The suite arguments arrive as "$@" after the script, so compose run can
    # pass them without replacing the script.
    entrypoint:
      - /bin/sh
      - -c
      - |
        python3 nmos-test.py "$$@" --output /tmp/report.xml
        rc=$$?
        echo "----- BEGIN JUNIT -----"
        cat /tmp/report.xml 2>/dev/null || echo "(no report written)"
        echo "----- END JUNIT -----"
        exit $$rc
      - sh

configs:
  writer-flow:
    content: |
      {"id":"7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d","label":"lane","description":"lane test pattern",
       "tags":{"urn:x-nmos:tag:grouphint/v1.0":["lane-writer:Video"]},
       "format":"urn:x-nmos:format:video","parents":[],"media_type":"video/v210",
       "grain_rate":{"numerator":50,"denominator":1},"frame_width":1280,"frame_height":720,
       "interlace_mode":"progressive","colorspace":"BT709",
       "components":[{"name":"Y","width":1280,"height":720,"bit_depth":10},
                     {"name":"Cb","width":640,"height":720,"bit_depth":10},
                     {"name":"Cr","width":640,"height":720,"bit_depth":10}]}
  registry-container-config:
    content: |
      registry_json=/config/registry.json
      log_output=FALSE
      update_label=FALSE
      update_ptp_domain=FALSE
      run_mqtt=FALSE
  registry-json:
    content: |
      {"label":"lane","http_port":8010,"query_ws_port":8011,"logging_level":0,
       "href_mode":2,"host_address":"172.30.99.10","host_addresses":["172.30.99.10"],
       "seed_id":"b6c4f4a0-9c1e-5a3d-8f2b-0d51c8e4a710",
       "query_paging_default":1000,"query_paging_limit":1000}
  testing-config:
    content: |
      from . import Config as CONFIG
      CONFIG.ENABLE_DNS_SD = False
      CONFIG.QUERY_API_HOST = "172.30.99.10"
      CONFIG.QUERY_API_PORT = 8010
